/* base */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
/* Layout: app shell — sticky wordmark bar, one scrolling column (max 960px), fixed bottom tab bar, full-screen sheets for the recipe card and the editor */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E4EAE6; --fg:#15211E; --muted:#58665F; --line:#D2DAD5;
  --accent:#B3202E; --accent-fg:#FFFFFF; --amber:#B97812; --ok:#2C7A4B; --warn:#A86200; --miss:#B03636;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --surface-2:#1F2B27; --fg:#E5ECE8; --muted:#98A69F; --line:#2C3B36;
  --accent:#EF5260; --accent-fg:#1B0508; --amber:#E6A83C; --ok:#62C48D; --warn:#E5A23E; --miss:#F07C7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --surface-2:#1F2B27; --fg:#E5ECE8; --muted:#98A69F; --line:#2C3B36;
  --accent:#EF5260; --accent-fg:#1B0508; --amber:#E6A83C; --ok:#62C48D; --warn:#E5A23E; --miss:#F07C7C; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.meta{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(100px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1.view{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:.92;text-transform:uppercase;margin:0;letter-spacing:.01em}
h2{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* controls */
input[type=text],input[type=search],input[type=number],select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--font-body);padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.small{padding:7px 11px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--miss)}
.icon-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font-size:20px;line-height:1;cursor:pointer}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:transparent;padding:11px 0;outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--font-body);padding:8px 6px;border-radius:8px;cursor:pointer;min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg .n{font-family:var(--font-mono);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.seg.mini{flex:0 0 auto}
.seg.mini button{padding:4px 10px;font-family:var(--font-mono);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--font-body);padding:6px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.controls{display:flex;flex-direction:column;gap:10px}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sort select{width:auto;padding:6px 10px;font-size:13px}
.filters{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.flabel{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.note-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--amber);border-radius:10px;padding:10px 12px;font-size:14px}
.note-banner b{color:var(--amber)}

/* catalogue grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{appearance:none;text-align:left;color:inherit;font:inherit;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;min-width:0;transition:transform .15s ease,border-color .15s ease}
.card:hover{border-color:var(--muted);transform:translateY(-2px)}
.cv{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);background:color-mix(in srgb,var(--c) 18%,var(--surface-2));display:grid;place-items:center;color:var(--fg)}
.cv .glass{height:80%;width:auto}
.cv img,.dhero img,.photo-prev img,.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;top:8px;left:8px;font:600 11px var(--font-body);padding:3px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pill.sub{color:var(--ok);border-color:var(--ok)}
.pill.one{color:var(--warn);border-color:var(--warn)}
.cb{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.cname{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere}
.cmeta{font-size:12px;color:var(--muted)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;min-height:18px}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px}
.stars .off{color:var(--line)}
.unrated{font-size:12px;color:var(--muted)}
.otag{font:600 10px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;padding-block:8px}
.grow{flex:1;min-width:0}
.sheet-title{font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-family:var(--font-mono);color:var(--muted);margin-right:auto}

/* detail */
.dhero{aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--surface-2);background:color-mix(in srgb,var(--c) 20%,var(--surface-2));color:var(--fg)}
.dhero .glass{height:80%;width:auto}
.dhead{display:flex;flex-direction:column;gap:8px}
.eyebrow{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail h1{font-family:var(--font-display);font-weight:800;font-size:clamp(42px,11vw,68px);line-height:.9;text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.rate{display:flex;align-items:center;gap:2px}
.rate button{appearance:none;border:0;background:none;cursor:pointer;font-size:28px;line-height:1;padding:2px;color:var(--line)}
.rate button.on{color:var(--amber)}
.rate-l{margin-left:8px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
@media (min-width:640px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.facts dd.mono{font-family:var(--font-mono);font-weight:500}
.avail{font-size:14px;font-weight:600}
.avail.ok{color:var(--ok)}
.avail.miss{color:var(--warn)}
.ings{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ings li{display:grid;grid-template-columns:10px 78px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.sub{background:transparent;border:2px solid var(--ok)}
.dot.miss{background:var(--miss)}
.dot.opt{background:var(--line)}
.q{font-family:var(--font-mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ings .nm{font-weight:600;min-width:0}
.ings small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.taste{display:flex;flex-direction:column;gap:8px}
.taste-row{display:grid;grid-template-columns:92px minmax(0,1fr) 18px;gap:10px;align-items:center;font-size:14px}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pips i{height:9px;border-radius:2px;background:var(--surface-2)}
.pips i.on{background:var(--accent)}
.tv{font-family:var(--font-mono);color:var(--muted);text-align:right}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px}
.detail .pips i{background:var(--surface-2);background:color-mix(in oklab,var(--c) 14%,var(--surface-2))}
.detail .pips i.on{background:var(--accent);background:color-mix(in oklab,var(--c) 72%,var(--fg))}
.detail .steps li::before{color:var(--accent);color:color-mix(in oklab,var(--c) 58%,var(--fg));font-weight:600}
.mynote textarea{min-height:96px}
/* photos : l'image remplit son cadre sans jamais l'agrandir */
.cv,.dhero,.photo-prev,.lthumb{position:relative;overflow:hidden}
.cv img,.dhero img,.photo-prev img,.lthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero{aspect-ratio:4/3}
.photo-box{grid-template-columns:160px minmax(0,1fr)}
.photo-prev{aspect-ratio:4/3}
@media (max-width:420px){.photo-box{grid-template-columns:1fr}.photo-prev{max-width:260px}}
/* recadrage 4:3 */
.crop{position:fixed;inset:0;z-index:55;background:rgb(0 0 0 / .62);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.crop-in{background:var(--bg);border-radius:12px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.crop-frame{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:8px;background:var(--surface-2);touch-action:none;cursor:grab}
.crop-frame:active{cursor:grabbing}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none}
.crop-frame::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgb(255 255 255 / .5);border-radius:8px;background:linear-gradient(to right,transparent calc(33.33% - .5px),rgb(255 255 255 / .4) calc(33.33% - .5px),rgb(255 255 255 / .4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgb(255 255 255 / .4) calc(66.66% - .5px),rgb(255 255 255 / .4) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(to bottom,transparent calc(33.33% - .5px),rgb(255 255 255 / .4) calc(33.33% - .5px),rgb(255 255 255 / .4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgb(255 255 255 / .4) calc(66.66% - .5px),rgb(255 255 255 / .4) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.crop-t{font-weight:700;font-size:16px}
[hidden]{display:none!important}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:59;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgb(0 0 0 / .18)}
.note-banner.install{border-color:var(--accent)}
.note-banner.install b{color:var(--accent)}
.note-banner .row-btns{flex:none;display:flex;gap:6px}

function seed(){
  const ings={}; ING.forEach(([id,name,cat,f,abv])=>ings[id]={name,cat,fam:FAMS[f],abv});
  const recipes=REC.map((x,i)=>({id:x[0],name:x[1],origin:x[2],author:'',method:x[3],glass:x[4],garnish:x[5],color:x[6],photo:'',
    flavor:{su:x[7][0],ac:x[7][1],am:x[7][2],as:x[7][3],fo:x[7][4]},tags:x[8],
    ings:x[9].map(([id,qty,unit,o])=>({id,qty,unit,sub:!!(o&&o.s),opt:!!(o&&o.o),alts:(o&&o.alts)||[]})),
    steps:x[10],note:x[11]||'',created:i}));
  return migrate({v:1,ings,recipes,
    owned:['gin','vodka','rhum-blanc','bourbon','campari','vermouth-rouge','triple-sec','creme-cassis','angostura','citron','citron-vert','sirop-sucre','eau-gazeuse','tonic','menthe'],
    lists:[{id:'fav',name:'Favoris',fixed:true,items:['negroni','daiquiri']},{id:'try',name:'À essayer',fixed:true,items:['last-word','mai-tai']}],
    ratings:{negroni:5,daiquiri:4,bramble:4},
    notes:{negroni:{text:"Parfait en apéro. Avec un vermouth plus vanillé, il devient plus rond. À tester avec un gin plus agrumes.",pub:false,at:Date.now()}},
    unit:'ml',example:true});
}

function migrate(d){
  (d.recipes||[]).forEach(r=>{
    if(r.origin==='Ma création'){ r.origin='Original'; r.by='me'; }
    else if(r.origin==='Autre barman'){ r.origin='Original'; r.by='other'; }
    else if(r.origin!=='Original') r.origin='Classique';
    if(r.origin==='Original'&&!r.by) r.by=r.author?'other':'me';
  });
  return d;
}

const APP_VERSION='1.0.0';
let storageOK=true, S=seed(), saveT=null;
const IDB={db:null};
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('zeste',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbGet(k){ return new Promise((res,rej)=>{ const q=IDB.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
function idbSet(k,v){ return new Promise((res,rej)=>{ const tx=IDB.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const validData=d=>!!(d&&d.v===1&&Array.isArray(d.recipes)&&d.ings&&typeof d.ings==='object');
function normalize(d){ if(!d.notes||typeof d.notes!=='object') d.notes={}; if(!d.ratings) d.ratings={}; if(!Array.isArray(d.owned)) d.owned=[]; if(!Array.isArray(d.lists)) d.lists=[]; return migrate(d); }
async function load(){
  try{
    IDB.db=await idbOpen();
    const d=await idbGet('state'); if(validData(d)) return normalize(d);
    try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(validData(o)){ const n=normalize(o); await idbSet('state',n); return n; } }catch(e){}
  }catch(e){ storageOK=false; }
  return seed();
}
function save(){ clearTimeout(saveT); saveT=setTimeout(flushSave,250); }
async function flushSave(){
  clearTimeout(saveT); saveT=null;
  if(!IDB.db){ storageOK=false; return; }
  try{ await idbSet('state',S); storageOK=true; }
  catch(e){ storageOK=false; toast("Sauvegarde impossible : l'espace de stockage est plein ou bloqué. Télécharge une sauvegarde depuis l'onglet Données."); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&saveT) flushSave(); });

/* availability and substitution logic */
function rowStatus(row,owned){
  if(owned.has(row.id)) return {st:'ok'};
  for(const a of (row.alts||[])) if(owned.has(a)) return {st:'sub',by:a};
  if(row.sub){ const cat=S.ings[row.id]&&S.ings[row.id].cat; for(const o of owned) if(o!==row.id&&S.ings[o]&&S.ings[o].cat===cat) return {st:'sub',by:o}; }
  return {st:row.opt?'opt':'miss'};
}
function analyze(r,owned){
  const miss=[]; let subs=0;
  const rows=r.ings.map(row=>{ const s=rowStatus(row,owned); if(s.st==='miss') miss.push(row.id); if(s.st==='sub') subs++; return s; });
  return {rows,miss,subs};
}
const origLabel=r=>r.origin!=='Original'?'Classique':'Original · '+(r.by==='other'?(r.author||'Autre barman'):'Ma création');
function statusPill(a){
  if(!a.miss.length) return a.subs?['sub','Avec substitut']:['ok','Réalisable'];
  return a.miss.length===1?['one','Manque 1']:['many',`Manque ${a.miss.length}`];
}
function estAbv(r){
  let alc=0,vol=0;
  r.ings.forEach(row=>{ const f=ML[row.unit]; if(f==null) return; const ml=(+row.qty||0)*f; const i=S.ings[row.id]; vol+=ml; alc+=ml*((i&&+i.abv)||0)/100; });
  if(!vol) return null;
  const d=DIL[r.method]!=null?DIL[r.method]:.15;
  return Math.round(alc/(vol*(1+d))*100);
}
function fmtOz(x){
  const r=Math.round(x*4)/4, w=Math.floor(r), f=r-w, F={0.25:'¼',0.5:'½',0.75:'¾'}[f]||'';
  return w?(F?`${w} ${F}`:`${w}`):(F||'0');
}
function fmtQty(row){
  const q=+row.qty||0;
  if(row.unit==='ml'||row.unit==='cl'){
    const ml=row.unit==='cl'?q*10:q;
    if(S.unit==='cl') return fr(ml/10)+' cl';
    if(S.unit==='oz') return fmtOz(ml/29.574)+' oz';
    return fr(ml)+' ml';
  }
  if(row.unit==='c. de bar') return fr(q)+' c. de bar';
  return fr(q)+' '+plural(q,row.unit);
}

    if(UI.tag&&!r.tags.includes(UI.tag)) return false;
    if(!UI.taste.every(k=>tasteMatch(r.flavor,k))) return false;
    if(words.length){ const hay=norm([r.name,r.author,r.garnish,origLabel(r),r.method,r.glass,...r.tags,...r.ings.map(i=>ingName(i.id)),S.notes[r.id]?S.notes[r.id].text:''].join(' ')); if(!words.every(w=>hay.includes(w))) return false; }
    return true;
  });
  const byName=(x,y)=>x.r.name.localeCompare(y.r.name,'fr');
  if(UI.sort==='rating') list.sort((x,y)=>(S.ratings[y.r.id]||0)-(S.ratings[x.r.id]||0)||byName(x,y));
  else if(UI.sort==='ready') list.sort((x,y)=>x.a.miss.length-y.a.miss.length||byName(x,y));
  else if(UI.sort==='recent') list.sort((x,y)=>(y.r.created||0)-(x.r.created||0));
  else list.sort(byName);
  el.innerHTML=list.length?list.map(({r,a})=>{
    const [cls,txt]=statusPill(a), rt=S.ratings[r.id]||0;
    return `<button class="card" data-act="open" data-id="${esc(r.id)}" style="--c:${okColor(r.color)}">

  }).join(''):`<div class="empty"><p>Aucun cocktail ne correspond.</p><button class="btn small" data-act="clear-all">Tout réafficher</button></div>`;
}

function renderBarTop(){
  const el=$('#bartop'); if(!el) return;
  const own=ownedSet(), cur=S.recipes.map(r=>analyze(r,own).miss.length);
  const nOk=cur.filter(n=>!n).length, nOne=cur.filter(n=>n===1).length;
  const used=new Set(S.recipes.flatMap(r=>r.ings.map(i=>i.id)));
  const gains=[...used].filter(id=>!own.has(id)&&S.ings[id]).map(id=>{
    const o2=new Set(own); o2.add(id);
    const won=S.recipes.filter((r,i)=>cur[i]>0&&!analyze(r,o2).miss.length);
    return {id,won};
  }).filter(g=>g.won.length).sort((a,b)=>b.won.length-a.won.length||ingName(a.id).localeCompare(ingName(b.id),'fr')).slice(0,5);
  el.innerHTML=`<div class="stats"><div><b>${S.owned.length}</b><span>${plural(S.owned.length,'ingrédient')}</span></div><div><b>${nOk}</b><span>${plural(nOk,'réalisable')}</span></div><div><b>${nOne}</b><span>à 1 ingrédient près</span></div></div>
  ${gains.length?`<section class="sec unlock"><h2>À acheter en priorité</h2><p class="hint">Les ingrédients qui débloquent le plus de recettes.</p><ol>${gains.map(g=>`<li><span class="gain">+${g.won.length}</span><span>${esc(ingName(g.id))}<small>${esc(g.won.map(r=>r.name).join(', '))}</small></span><button class="btn small" data-act="own-add" data-id="${esc(g.id)}">Je l'ai</button></li>`).join('')}</ol></section>`:''}`;
}
function renderBarList(){
  const el=$('#barlist'); if(!el) return;
  const own=ownedSet(), q=norm(UI.barQ);
  const ids=Object.keys(S.ings).filter(id=>!q||norm(S.ings[id].name+' '+S.ings[id].cat).includes(q));

function hexToHsl(h){ const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255, mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let H=0,S=0; const L=(mx+mn)/2; if(d){ S=d/(1-Math.abs(2*L-1)); H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; H*=60; if(H<0) H+=360; } return [Math.round(H),Math.round(S*100),Math.round(L*100)]; }

const CROP={};
function openCrop(src){
  const img=new Image();
  img.onload=()=>{
    CROP.img=img; CROP.zoom=1; $('#crop-zoom').value=1; $('#crop-img').src=src; $('#crop').hidden=false;
    requestAnimationFrame(()=>{ const f=$('#crop-frame'); CROP.W=f.clientWidth; CROP.H=f.clientHeight;
      CROP.s0=Math.max(CROP.W/img.naturalWidth,CROP.H/img.naturalHeight); CROP.s=CROP.s0;
      CROP.x=(CROP.W-img.naturalWidth*CROP.s)/2; CROP.y=(CROP.H-img.naturalHeight*CROP.s)/2; drawCrop(); });
  };
  img.onerror=()=>toast('Impossible de lire cette image. Essaie un JPEG ou un PNG.');
  img.src=src;
}
function drawCrop(){
  const i=CROP.img; if(!i) return; const w=i.naturalWidth*CROP.s, h=i.naturalHeight*CROP.s;
  CROP.x=Math.min(0,Math.max(CROP.W-w,CROP.x)); CROP.y=Math.min(0,Math.max(CROP.H-h,CROP.y));
  const el=$('#crop-img'); el.style.width=w+'px'; el.style.height=h+'px'; el.style.transform=`translate(${CROP.x}px,${CROP.y}px)`;
}
function zoomCrop(z){
  if(!CROP.img) return; const cx=(CROP.W/2-CROP.x)/CROP.s, cy=(CROP.H/2-CROP.y)/CROP.s;
  CROP.zoom=z; CROP.s=CROP.s0*z; CROP.x=CROP.W/2-cx*CROP.s; CROP.y=CROP.H/2-cy*CROP.s; drawCrop();
}
function closeCrop(){ $('#crop').hidden=true; $('#crop-img').removeAttribute('src'); CROP.img=null; CROP.drag=null; }
function finishCrop(){
  if(!CROP.img) return; const c=document.createElement('canvas'); c.width=800; c.height=600;
  c.getContext('2d').drawImage(CROP.img,-CROP.x/CROP.s,-CROP.y/CROP.s,CROP.W/CROP.s,CROP.H/CROP.s,0,0,800,600);
  sheetState.photo=c.toDataURL('image/jpeg',.8); closeCrop(); updatePrev();

(()=>{ const fr=document.getElementById('crop-frame');
  fr.addEventListener('pointerdown',e=>{ if(!CROP.img) return; fr.setPointerCapture(e.pointerId); CROP.drag={px:e.clientX,py:e.clientY,x:CROP.x,y:CROP.y}; });
  fr.addEventListener('pointermove',e=>{ if(!CROP.drag) return; CROP.x=CROP.drag.x+e.clientX-CROP.drag.px; CROP.y=CROP.drag.y+e.clientY-CROP.drag.py; drawCrop(); });
  ['pointerup','pointercancel'].forEach(t=>fr.addEventListener(t,()=>CROP.drag=null));
  fr.addEventListener('wheel',e=>{ if(!CROP.img) return; e.preventDefault(); const z=Math.min(3,Math.max(1,CROP.zoom*(e.deltaY<0?1.08:1/1.08))); $('#crop-zoom').value=z; zoomCrop(z); },{passive:false});
})();
function readPhoto(file){

      if(!txt){ er.textContent='Choisis un fichier ou colle une sauvegarde d\'abord.'; er.hidden=false; UI.confirm=null; break; }
      let d; try{ d=JSON.parse(txt); }catch(x){ er.textContent='Ce texte n\'est pas un export lisible (JSON invalide).'; er.hidden=false; UI.confirm=null; break; }
      if(!d||d.v!==1||!Array.isArray(d.recipes)||!d.ings||typeof d.ings!=='object'){ er.textContent='Format non reconnu : il faut une sauvegarde de Zeste.'; er.hidden=false; UI.confirm=null; break; }
      if(UI.confirm!=='import'){ UI.confirm='import'; b.textContent='Confirmer : remplacer mes données'; break; }
      S=normalize(Object.assign({unit:'ml',ratings:{},notes:{},owned:[],lists:[{id:'fav',name:'Favoris',fixed:true,items:[]},{id:'try',name:'À essayer',fixed:true,items:[]}]},d,{example:false}));
      UI.confirm=null; UI.impText=''; UI.impName=''; flushSave(); render(); toast(`${S.recipes.length} recettes restaurées`); break;
    }
    case 'reset':
      if(UI.confirm==='reset'){ S=seed(); UI.confirm=null; save(); UI.view='catalogue'; render(); toast('Exemple rechargé'); }
      else { UI.confirm='reset'; renderData($('#view')); }
      break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='my-note'){ autosize(t); const id=t.dataset.id, cur=S.notes[id]||{pub:false}; S.notes[id]={text:t.value,pub:!!cur.pub,at:Date.now()}; if(!t.value.trim()&&!cur.pub) delete S.notes[id]; clearTimeout(noteT); noteT=setTimeout(()=>{ noteT=null; save(); const h=$('#note-st'); if(h) h.textContent=noteHint(S.notes[id]); },500); return; }
  if(t.id==='crop-zoom'){ zoomCrop(+t.value); return; }
  if(t.classList.contains('cr')){ paintHSL(); setColor(hslToHex(+$('#cc-h').value,+$('#cc-s').value,+$('#cc-l').value),false); return; }
  if(t.id==='cf-q'){ UI.q=t.value; renderResults(); return; }
  if(t.id==='bar-q'){ UI.barQ=t.value; renderBarList(); return; }
  if(t.classList.contains('f-ing')){ checkNew(t.closest('.frow')); return; }
  if(t.id==='rf-color'){ updatePrev(); return; }
  if(t.id&&t.id.startsWith('rf-')&&t.type==='range'){ $('#ro-'+t.id.slice(3)).textContent=t.value; }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='rf-by'){ syncOrig(); return; }
  if(t.dataset.own){ const id=t.dataset.own; S.owned=t.checked?[...new Set([...S.owned,id])]:S.owned.filter(x=>x!==id); save(); renderBarTop(); updateMeta();
    const h=t.closest('.fam')&&t.closest('.fam').querySelector('h3 span'); if(h){ const boxes=t.closest('.fam').querySelectorAll('input[data-own]'); h.textContent=`${[...boxes].filter(x=>x.checked).length}/${boxes.length}`; } return; }
  switch(t.id){
    case 'cf-method': UI.method=t.value; renderCatalogue($('#view')); break;
    case 'cf-glass': UI.glass=t.value; renderCatalogue($('#view')); break;
    case 'cf-tag': UI.tag=t.value; renderCatalogue($('#view')); break;
    case 'cf-sort': UI.sort=t.value; renderResults(); break;
    case 'rf-glass': updatePrev(); break;
    case 'rf-photo': {
      const f=t.files&&t.files[0]; if(!f) break;
      const rd=new FileReader(); rd.onload=()=>openCrop(rd.result); rd.onerror=()=>toast('Impossible de lire cette image. Essaie un JPEG ou un PNG.'); rd.readAsDataURL(f); t.value='';
      break;
    }
    case 'imp-file': {
      const f=t.files&&t.files[0]; if(!f) break;
      const rd=new FileReader(); rd.onload=()=>{ UI.impText=rd.result; UI.impName=f.name; const n=$('#imp-name'); if(n) n.textContent='Fichier prêt : '+f.name; toast('Fichier chargé : touche Restaurer'); }; rd.readAsText(f); t.value=''; break;
    }
  }
});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#pick').hidden) closePick(); else if(!$('#crop').hidden) closeCrop(); else if(sheetState) closeSheet(); } });

new MutationObserver(enhanceSelects).observe(document.body,{childList:true,subtree:true});
(async()=>{
  S=await load(); render(); enhanceSelects();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
</html>
