<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeste Cocktails</title>
<meta name="description" content="Zeste, ton carnet de cocktails : catalogue de classiques, tes créations avec photo, ton bar et ce que tu peux préparer avec.">
<meta name="theme-color" content="#F1F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <span class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18L12 15z"/><path d="M12 15v6M8 21h8"/></svg>Zeste</span>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="nav" aria-label="Navigation"><div class="nav-in">
  <span class="brand rail-brand" style="order:-2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18L12 15z"/><path d="M12 15v6M8 21h8"/></svg>Zeste</span>
  <button data-act="view" data-v="catalogue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Catalogue</button>
  <button data-act="view" data-v="bar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4v4l2 3v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10l2-3z"/><path d="M8 13h8"/></svg>Mon bar</button>
  <button data-act="new" class="add" aria-label="Ajouter une recette"><span class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="lbl-short">Ajouter</span><span class="lbl-long">Nouvelle recette</span></button>
  <button data-act="view" data-v="lists"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Listes</button>
  <button data-act="view" data-v="data"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v13M3.5 13.5 7 17l3.5-3.5M17 20V7M13.5 10.5 17 7l3.5 3.5"/></svg>Données</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="pick" id="pick" hidden><div class="pick-in" role="listbox"></div></div>
<div class="crop" id="crop" hidden role="dialog" aria-modal="true" aria-labelledby="crop-t"><div class="crop-in">
  <p class="crop-t" id="crop-t">Recadre ta photo</p>
  <div class="crop-frame" id="crop-frame"><img id="crop-img" alt="" draggable="false"></div>
  <label class="slider" for="crop-zoom"><span>Zoom</span><input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1"><span></span></label>
  <p class="hint">Fais glisser la photo pour choisir le cadrage. Elle sera enregistrée au format 4:3.</p>
  <div class="row-btns"><button class="btn" data-act="crop-cancel">Annuler</button><button class="btn primary" data-act="crop-ok">Valider le recadrage</button></div>
</div></div>
<div class="update" id="update" hidden role="status"><span>Une nouvelle version de Zeste est prête.</span><button class="btn small primary" data-act="apply-update">Mettre à jour</button></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
